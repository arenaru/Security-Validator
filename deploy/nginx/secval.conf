# SecVal reverse proxy config
#
# Taruh di VPS: /etc/nginx/sites-available/secval
# Lalu symlink ke sites-enabled dan reload nginx.
#
# NOTE: block "listen 443 ssl" + path sertifikat TIDAK ditulis di sini.
# certbot --nginx yang nambahin otomatis saat lo jalanin SSL step.
# Jadi setelah certbot jalan, file ini bakal dimodif otomatis sama certbot.

server {
    listen 80;
    listen [::]:80;
    server_name secval.my.id;

    # Hasil build frontend (vite build -> dist/) dicopy ke sini oleh deploy.sh
    root /var/www/secval;
    index index.html;

    # Batas ukuran body (buat request scan yang agak besar)
    client_max_body_size 10m;

    # Semua request /api/ diteruskan ke backend FastAPI (container, localhost only)
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Scan bisa lama, naikin timeout biar ga keputus
        proxy_read_timeout  300s;
        proxy_send_timeout  300s;
    }

    # SPA React: route apapun yang bukan file beneran dilempar ke index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache aset statis (js/css/img) biar ngebut
    location ~* \.(?:js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        try_files $uri =404;
    }
}
