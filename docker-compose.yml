services:
  secval:
    build: .
    container_name: secval-app
    ports:
      - "8000:8000"
    restart: unless-stopped
    environment:
      - TZ=Asia/Jakarta
    volumes:
      - ./backend:/app/backend
      - ./docs:/app/docs

  frontend:
    image: node:20-alpine
    container_name: secval-frontend
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 3000"
    ports:
      - "3000:3000"
    restart: unless-stopped
    environment:
      - CHOKIDAR_USEPOLLING=true
      - VITE_API_PROXY_TARGET=http://secval:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      secval:
        condition: service_healthy
