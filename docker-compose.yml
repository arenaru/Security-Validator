version: '3.8'

services:
  secval:
    build: .
    container_name: secval-app
    ports:
      - "8501:8501"
    restart: unless-stopped
    environment:
      - TZ=Asia/Jakarta
    volumes:
      - ./app.py:/app/app.py
      - ./components:/app/components
      - ./script:/app/script
      - ./utils:/app/utils
      - ./static:/app/static
