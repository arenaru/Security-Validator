services:
  secval:
    build: .
    container_name: secval-app
    ports:
      - "8000:8000"
    restart: unless-stopped
    environment:
      - TZ=Asia/Jakarta
    volumes:
      - ./backend:/app/backend
      - ./docs:/app/docs

  telegram-bot:
    build:
      context: .
      dockerfile: bot/Dockerfile
    container_name: secval-telegram-bot
    restart: unless-stopped
    environment:
      - TZ=Asia/Jakarta
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:?Set TELEGRAM_BOT_TOKEN in .env}
      - TELEGRAM_ALLOWED_USER_IDS=${TELEGRAM_ALLOWED_USER_IDS:?Set TELEGRAM_ALLOWED_USER_IDS in .env}
      - API_BASE_URL=http://secval:8000/api
    depends_on:
      secval:
        condition: service_healthy

  frontend:
    image: node:20-alpine
    container_name: secval-frontend
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 3000"
    ports:
      - "3000:3000"
    restart: unless-stopped
    environment:
      - CHOKIDAR_USEPOLLING=true
      - VITE_API_PROXY_TARGET=http://secval:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      secval:
        condition: service_healthy
