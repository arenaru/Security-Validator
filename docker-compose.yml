services:
  secval:
    build: .
    container_name: secval-app
    ports:
      - "8000:8000"
    restart: unless-stopped
    environment:
      - TZ=Asia/Jakarta
    volumes:
      - ./backend:/app/backend
      - ./docs:/app/docs

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: secval-frontend
    ports:
      - "3000:3000"
    restart: unless-stopped
    # The image bakes the source in via `COPY . .`, so without these mounts the
    # dev server keeps serving the code it was built with and edits never show
    # up. Only src/ and index.html are mounted: mounting the whole ./frontend
    # would shadow the container's node_modules, whose native binaries (esbuild,
    # rollup) are built for alpine/musl and differ from the host's.
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/index.html:/app/index.html
    environment:
      - CHOKIDAR_USEPOLLING=true
      - VITE_API_PROXY_TARGET=http://secval:8000
    depends_on:
      secval:
        condition: service_healthy
